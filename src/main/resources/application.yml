spring:
  application:
    name: member-preferences-service
  jackson:
    default-property-inclusion: non_empty
    property-naming-strategy: LOWER_CAMEL_CASE

server:
  port: 8080
  servlet:
    context-path: /

preferences:
  patch:
    enabled: true
  rate-limit:
    enabled: true
    requests-per-minute: 60
    per-member-limit: 10
  request-timeout-ms: 5000
  cache:
    ttl-seconds: 300
    max-size: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,configprops
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.preferences: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
security:
  api-key: secret-api-key-12345
  max-body-size-bytes: 2048